# ==============================================================================
# Cronstash - Nginx Reverse Proxy Configuration (Debian 13 Trixie)
# Listening on 127.0.0.1:8080 (also available on 0.0.0.0:8080 if needed)
# Serving SvelteKit SPA Static Assets & Proxying FastAPI Backend
# ==============================================================================

server {
    listen 127.0.0.1:8080;
    server_name localhost cronstash.local _;

    root /opt/cronstash/frontend/build;
    index index.html;

    # Maximum upload size for large database dumps and restores
    client_max_body_size 4G;

    # Gzip Compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss font/woff font/woff2 application/font-woff;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Static Assets & SPA Routing
    location / {
        try_files $uri $uri/ /index.html =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Immutable static assets generated by SvelteKit (_app/immutable/)
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API Endpoints (Reverse Proxy to FastAPI / Uvicorn on 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        # Upgrade headers for WebSocket connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy backup streaming and downloads
        proxy_connect_timeout 120s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;

        # Disable buffering for chunked streaming downloads of huge backup files
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
